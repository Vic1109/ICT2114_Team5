<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Two-step verification · Wazuh Telemetry Analyser</title>
  <link rel="stylesheet" href="/static/css/soc.css?v={{ static_version }}">
</head>
<body class="theme-overview">
  <main class="page" style="max-width:32rem;margin:8vh auto">
    <section class="panel">
      <h1>Two-step verification</h1><p>Enter the current six-digit code from Microsoft Authenticator.</p>
      {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/mfa/verify" autocomplete="one-time-code">
        <label for="code">Authenticator code</label><input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus>
        <button type="submit">Verify and sign in</button>
      </form>
      <p><a href="/login">Return to sign in</a></p>
    </section>
  </main>
</body></html>

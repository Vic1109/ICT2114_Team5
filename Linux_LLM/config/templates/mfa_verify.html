<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Two-step verification · Wazuh Telemetry Analyser</title>
  <link rel="stylesheet" href="/static/css/soc.css?v={{ static_version }}">
</head>
<body class="theme-overview auth-page">
  <main class="auth-shell">
    <section class="panel auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title">Two-step verification</h1><p>Enter the current six-digit code from Microsoft Authenticator.</p>
      {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
      <form class="auth-form" method="post" action="/mfa/verify" autocomplete="on">
        <div class="form-group">
          <label for="code">Authenticator code</label>
          <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus>
        </div>
        <div class="auth-actions">
          <button type="submit" class="primary">Verify and sign in</button>
          <a class="btn btn-secondary" href="/login">Return to sign in</a>
        </div>
      </form>
    </section>
  </main>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wazuh Telemetry Analyser{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/soc.css?v={{ static_version }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="theme-{{ active_page }}">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="app-header">
        <div class="app-header-inner">
            <div class="brand">
                <span class="brand-title">Wazuh Telemetry Analyser</span>
                <span class="brand-sub">{% block brand_sub %}SOC analysis workspace{% endblock %}</span>
            </div>
            {% include "_nav.html" %}
            {% block header_actions %}{% endblock %}
        </div>
    </header>
    <main id="main" class="page {% block page_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/script.js?v={{ static_version }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>

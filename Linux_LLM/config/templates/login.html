<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · Wazuh Telemetry Analyser</title>
  <link rel="stylesheet" href="/static/css/soc.css?v={{ static_version }}">
</head>
<body class="theme-overview">
  <main class="page" style="max-width:32rem;margin:8vh auto">
    <section class="panel">
      <h1>Sign in</h1><p>Wazuh Telemetry Analyser</p>
      {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/login" autocomplete="on">
        <label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Continue</button>
      </form>
    </section>
  </main>
</body></html>

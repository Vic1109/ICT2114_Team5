<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Alert Viewer</title>
    <link rel="stylesheet" href="/static/css/soc.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="app-header">
        <div class="app-header-inner">
            <div class="brand">
                <span class="brand-title">Wazuh Telemetry Analyser</span>
                <span class="brand-sub">Live alert viewer</span>
            </div>
            <nav class="nav" aria-label="Primary">
                <a href="/">Overview</a>
                <a href="/#knowledge">Knowledge base</a>
                <a href="/#analysis">Analysis</a>
                <a href="/alerts/viewer" aria-current="page">Alert viewer</a>
                <a href="/#reports">Reports</a>
                <a href="/#settings">Diagnostics</a>
            </nav>
        </div>
    </header>

    <main id="main" class="page">
        <section class="panel">
            <div class="toolbar">
                <div>
                    <h1>Live alert viewer</h1>
                    <p class="lede" id="cacheStatus">Connecting to live alerts...</p>
                </div>
                <div class="report-actions">
                    <div class="checkbox-group" style="margin: 0;">
                        <input type="checkbox" id="autoRefreshToggle" checked onchange="toggleAutoRefresh()">
                        <label for="autoRefreshToggle">Auto-refresh (<span id="refreshInterval">15</span>s)</label>
                    </div>
                    <button type="button" onclick="refreshAlerts()">Refresh now</button>
                    <button type="button" class="btn-primary" onclick="analyzeSelected()" id="analyzeBtn" disabled>
                        Analyze selected (<span id="selectedCount">0</span>)
                    </button>
                </div>
            </div>
            <div id="analysisProgress" class="progress-container" hidden></div>
            <div id="alertsContainer">
                <div class="empty-state">Loading alerts...</div>
            </div>
        </section>
    </main>

    <script>
    let allAlerts = [];
    let selectedAlertUuids = new Set();
        let currentPage = 1;
        let pageSize = 10;
        let totalPages = 1;
        let totalAlerts = 0;
        let minSeverity = 0;

        let autoRefreshInterval = null;
        let autoRefreshEnabled = true;
        let refreshIntervalSeconds = 15;
        let redirectCheckInterval = null;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function copyValue(value, button) {
            const text = String(value ?? '');
            const done = () => {
                if (!button) return;
                const previous = button.textContent;
                button.textContent = 'Copied';
                setTimeout(() => { button.textContent = previous; }, 1200);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done).catch(() => done());
            } else {
                done();
            }
        }

        async function refreshAlerts(page = 1) {
            try {
                const container = document.getElementById('alertsContainer');
                container.innerHTML = '<div class="empty-state"><strong>Loading alerts</strong>Fetching the current page from the live-alert API.</div>';

                const url = `/api/live-alerts?page=${page}&page_size=${pageSize}&min_severity=${minSeverity}`;

                const response = await fetch(url);

                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('Authentication required. Please log in again.');
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.message || 'API returned unsuccessful response');
                }

                currentPage = data.page;
                totalPages = data.total_pages;
                totalAlerts = data.total_alerts;
                allAlerts = data.alerts;

                const cacheStatus = document.getElementById('cacheStatus');
                cacheStatus.textContent = `Live — updated at ${new Date().toLocaleTimeString()}`;

                renderAlertsTable(allAlerts);
                renderPagination();
            } catch (error) {
                console.error('Error fetching alerts:', error);
                const container = document.getElementById('alertsContainer');
                container.innerHTML = `
                    <div class="notice error" role="alert">
                        <h3>Alerts could not be loaded</h3>
                        <p>The live-alert API did not return a usable page. Confirm authentication and Wazuh connectivity, then retry.</p>
                        <button type="button" onclick="refreshAlerts()">Try again</button>
                        <details><summary>Technical details</summary><pre>${escapeHtml(error.message)}</pre></details>
                    </div>
                `;
                const cacheStatus = document.getElementById('cacheStatus');
                cacheStatus.textContent = 'Failed to load';
            }
        }

        function renderPagination() {
            const container = document.getElementById('alertsContainer');
            let paginationHtml = `
                <div class="pagination-wrapper" aria-label="Alert pagination">
                    <div class="pagination-summary">
                        Showing ${allAlerts.length} of ${totalAlerts} alerts
                        (Page ${currentPage} of ${totalPages})
                    </div>
                    <div>
                        <label for="minSeverityFilter">Min severity</label>
                        <select id="minSeverityFilter" onchange="changeSeverityFilter(this.value)">
                            <option value="0" ${minSeverity === 0 ? 'selected' : ''}>All</option>
                            <option value="5" ${minSeverity === 5 ? 'selected' : ''}>Medium+ (5+)</option>
                            <option value="8" ${minSeverity === 8 ? 'selected' : ''}>High+ (8+)</option>
                            <option value="12" ${minSeverity === 12 ? 'selected' : ''}>Critical (12+)</option>
                        </select>
                    </div>
                    <div class="pagination-controls">
                        <button type="button" class="pagination-button" ${currentPage === 1 ? 'disabled' : ''} onclick="refreshAlerts(1)">First</button>
                        <button type="button" class="pagination-button" ${currentPage === 1 ? 'disabled' : ''} onclick="refreshAlerts(${currentPage - 1})">Previous</button>
            `;

            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            for (let i = startPage; i <= endPage; i++) {
                paginationHtml += `
                    <button type="button" class="pagination-button${i === currentPage ? ' btn-primary' : ''}" onclick="refreshAlerts(${i})">${i}</button>
                `;
            }

            paginationHtml += `
                        <button type="button" class="pagination-button" ${currentPage === totalPages ? 'disabled' : ''} onclick="refreshAlerts(${currentPage + 1})">Next</button>
                        <button type="button" class="pagination-button" ${currentPage === totalPages ? 'disabled' : ''} onclick="refreshAlerts(${totalPages})">Last</button>
                    </div>
                </div>
            `;

            container.innerHTML += paginationHtml;
        }

        function changeSeverityFilter(newMinSeverity) {
            minSeverity = parseInt(newMinSeverity);
            currentPage = 1;
            selectedAlertUuids.clear();
            updateSelectionUI();
            refreshAlerts(1);
        }

        function toggleAutoRefresh() {
            const toggle = document.getElementById('autoRefreshToggle');
            autoRefreshEnabled = toggle.checked;

            if (autoRefreshEnabled) {
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        }

        function startAutoRefresh() {
            stopAutoRefresh();
            autoRefreshInterval = setInterval(() => {
                refreshAlerts(currentPage);
            }, refreshIntervalSeconds * 1000);
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        function renderAlertsTable(alerts) {
            const container = document.getElementById('alertsContainer');

            if (alerts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <strong>No alerts on this page</strong>
                        No live alerts match the current severity filter. Lower the minimum severity or wait for new events.
                    </div>
                `;
                return;
            }

            let html = `
                <div class="checkbox-group">
                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                    <label for="selectAll">Select all (${alerts.length} alerts)</label>
                </div>
                <div class="table-wrap">
                    <table class="data">
                        <thead>
                            <tr>
                                <th>Select</th>
                                <th>Timestamp</th>
                                <th>Severity</th>
                                <th>Rule description</th>
                                <th>Source IP</th>
                                <th>Dest IP</th>
                                <th>Direction</th>
                                <th>Agent</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            alerts.forEach(alert => {
                const severity = getSeverityLevel(alert.rule_level);
                const severityClass = `severity-${severity.toLowerCase()}`;
                const alertUuid = String(alert.alert_uuid || '');
                const encodedAlertUuid = encodeURIComponent(alertUuid);
                const isSelected = selectedAlertUuids.has(alertUuid);

                const timestamp = alert.timestamp ? new Date(alert.timestamp).toLocaleString() : '';
                const direction = alert.threat_classification?.threat_direction || 'unknown';
                const src = alert.src_ip || '-';
                const dest = alert.dest_ip || '-';

                html += `
                    <tr class="alert-row ${isSelected ? 'selected-row' : ''}" onclick="toggleAlert(decodeURIComponent('${encodedAlertUuid}'))">
                        <td><input type="checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleAlert(decodeURIComponent('${encodedAlertUuid}'))"></td>
                        <td>${escapeHtml(timestamp)}</td>
                        <td class="${severityClass}">${severity} (${escapeHtml(String(alert.rule_level ?? ''))})</td>
                        <td>${escapeHtml(alert.rule_description || 'N/A')}</td>
                        <td class="ioc-value">${escapeHtml(src)}${src !== '-' ? ` <button type="button" class="btn-sm copy-btn" onclick="event.stopPropagation(); copyValue('${escapeHtml(src)}', this)">Copy</button>` : ''}</td>
                        <td class="ioc-value">${escapeHtml(dest)}${dest !== '-' ? ` <button type="button" class="btn-sm copy-btn" onclick="event.stopPropagation(); copyValue('${escapeHtml(dest)}', this)">Copy</button>` : ''}</td>
                        <td>${escapeHtml(direction)}</td>
                        <td>${escapeHtml(alert.agent_name || 'N/A')}</td>
                    </tr>
                `;
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function getSeverityLevel(level) {
            if (level >= 12) return 'CRITICAL';
            if (level >= 8) return 'HIGH';
            if (level >= 5) return 'MEDIUM';
            return 'LOW';
        }

        function toggleAlert(alertUuid) {
            if (selectedAlertUuids.has(alertUuid)) {
                selectedAlertUuids.delete(alertUuid);
            } else {
                selectedAlertUuids.add(alertUuid);
            }
            updateSelectionUI();
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll').checked;

            if (selectAll) {
                allAlerts.forEach(alert => selectedAlertUuids.add(alert.alert_uuid));
            } else {
                selectedAlertUuids.clear();
            }

            updateSelectionUI();
        }

        function updateSelectionUI() {
            document.getElementById('selectedCount').textContent = selectedAlertUuids.size;
            document.getElementById('analyzeBtn').disabled = selectedAlertUuids.size === 0;
            renderAlertsTable(allAlerts);
            renderPagination();
        }

        async function analyzeSelected() {
            if (selectedAlertUuids.size === 0) {
                alert('Please select at least one alert');
                return;
            }

            const analyzeBtn = document.getElementById('analyzeBtn');
            analyzeBtn.disabled = true;
            analyzeBtn.textContent = 'Analysing...';
            const progress = document.getElementById('analysisProgress');
            progress.hidden = false;
            progress.innerHTML = `
                <ol class="stage-list" aria-label="Analysis stages">
                    <li class="current">Submit selection</li>
                    <li>Parse</li>
                    <li>Extract IOCs</li>
                    <li>Search CTI</li>
                    <li>Generate analysis</li>
                    <li>Report ready</li>
                </ol>
                <p>Analysing selected alerts. This page polls for a completed report without fabricating percentage progress.</p>
            `;

            try {
                const response = await fetch('/analyze-selected-alerts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        selected_uuids: Array.from(selectedAlertUuids)
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();
                const sessionId = data.session_id;
                const pollingTimeoutMs = Math.min(
                    86400000,
                    Math.max(60000, Number(data.poll_timeout_ms) || 660000)
                );

                if (redirectCheckInterval) {
                    clearInterval(redirectCheckInterval);
                    redirectCheckInterval = null;
                }

                let checkCount = 0;
                const maxChecks = Math.ceil(pollingTimeoutMs / 2000);

                redirectCheckInterval = setInterval(async () => {
                    checkCount++;

                    if (checkCount > maxChecks) {
                        clearInterval(redirectCheckInterval);
                        redirectCheckInterval = null;
                        analyzeBtn.disabled = false;
                        analyzeBtn.innerHTML = 'Analyze selected (<span id="selectedCount">' + selectedAlertUuids.size + '</span>)';
                        progress.innerHTML = `
                            <div class="notice error" role="alert">
                                <h3>Analysis did not finish in time</h3>
                                <p>The selected-alert analysis exceeded the configured wait window. Check the reports page or retry.</p>
                            </div>
                        `;
                        return;
                    }

                    try {
                        const checkResponse = await fetch(`/api/check-analysis-result/${sessionId}`);
                        const checkResult = await checkResponse.json();

                        if (checkResult.redirect && checkResult.report_id) {
                            clearInterval(redirectCheckInterval);
                            redirectCheckInterval = null;
                            window.location.href = `/review-report/${checkResult.report_id}`;
                        }
                    } catch (err) {
                        console.error('Error checking redirect:', err);
                    }
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                progress.innerHTML = `
                    <div class="notice error" role="alert">
                        <h3>Analysis could not start</h3>
                        <p>The selected-alert request was rejected. Confirm the knowledge base is ready and retry.</p>
                        <details><summary>Technical details</summary><pre>${escapeHtml(error.message)}</pre></details>
                    </div>
                `;

                analyzeBtn.disabled = false;
                analyzeBtn.innerHTML = 'Analyze selected (<span id="selectedCount">' + selectedAlertUuids.size + '</span>)';
            }
        }

        window.addEventListener('beforeunload', function() {
            stopAutoRefresh();
            if (redirectCheckInterval) {
                clearInterval(redirectCheckInterval);
            }
        });

        refreshAlerts().then(() => {
            if (autoRefreshEnabled) {
                startAutoRefresh();
            }
        }).catch(error => {
            console.error('Failed to load initial alerts:', error);
        });
    </script>
</body>
</html>
